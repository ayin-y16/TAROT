<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta
      name="description"
      content="一个支持单牌与过去、现在、未来三牌阵的宝石塔罗抽牌网页。"
    />
    <title>宝石塔罗</title>

    <!-- 可选：网络可用时加载更适合塔罗主题的字体；不可用时自动使用系统字体。 -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Noto+Serif+SC:wght@300;400;500;600&display=swap"
  rel="stylesheet"
/>

    <link rel="stylesheet" href="./styles.css" />
  </head>

<button
  class="music-toggle"
  type="button"
  data-action="toggle-music"
  aria-label="播放背景音乐"
  aria-pressed="false"
  title="播放背景音乐"
>
  ♪
</button>

<audio id="background-music" preload="metadata" loop></audio>

  <body>
    <div id="app" class="app-shell">
      <!-- 星空粒子层：Canvas 渲染，位于背景图之下（z-index:-5） -->
      <canvas id="starfield" aria-hidden="true"></canvas>
      <!-- 最底层流转呼吸光（z-index:-6） -->
      <div class="bg-glow-layer" aria-hidden="true"></div>
      <!-- 背景层（中景，不移动）：路径将在 app.js 的 SITE_CONFIG 中统一配置 -->
      <div class="background-layer" aria-hidden="true"></div>
      <!-- 前景层（会移动）：比中景大 10% 的 PNG，随指针视差移动（z-index:-3） -->
      <div class="foreground-layer" aria-hidden="true"></div>
      <div class="background-overlay" aria-hidden="true"></div>
      <div class="grain-layer" aria-hidden="true"></div>
      <!-- 全站宝石名称同心圆动效：位于背景与页面内容之间。 -->
      <canvas id="gemstone-orbit" class="gemstone-orbit" aria-hidden="true"></canvas>

      <!-- =========================================================
           首页：选择牌阵
      ========================================================== -->
      <main id="home-page" class="page page--home is-active" data-page="home">
        <section class="home-hero" aria-labelledby="home-title">
          <p class="eyebrow">GEMSTONE TAROT</p>
          <h1 id="home-title" class="site-title">宝石塔罗</h1>
          <p class="home-intro">让宝石与塔罗，为你指引此刻的方向。</p>

          <div class="spread-choice-grid" aria-label="选择牌阵">
            <button
              class="spread-choice-card"
              type="button"
              data-action="start-reading"
              data-spread="three"
            >
              <span class="spread-choice-card__ornament" aria-hidden="true">✦</span>
              <span class="spread-choice-card__count">THREE CARDS</span>
              <strong class="spread-choice-card__title">时间之流</strong>
              <span class="spread-choice-card__description">
                抽取三张牌，解读过去、现在与未来。
              </span>
              <span class="spread-choice-card__positions" aria-hidden="true">
                <i>过去</i><i>现在</i><i>未来</i>
              </span>
            </button>

            <button
              class="spread-choice-card"
              type="button"
              data-action="start-reading"
              data-spread="single"
            >
              <span class="spread-choice-card__ornament" aria-hidden="true">✦</span>
              <span class="spread-choice-card__count">ONE CARD</span>
              <strong class="spread-choice-card__title">单牌解读</strong>
              <span class="spread-choice-card__description">
                抽取一张牌，获得当下的指引。
              </span>
              <span class="spread-choice-card__positions" aria-hidden="true">
                <i>此刻的指引</i>
              </span>
            </button>
          </div>

          <button
            class="text-button home-library-link"
            type="button"
            data-action="open-library"
          >
            浏览完整牌库
          </button>
        </section>
      </main>

      <!-- =========================================================
           抽牌页
      ========================================================== -->
      <main id="draw-page" class="page page--draw" data-page="draw" hidden>
        <header class="page-header draw-header">
          <button class="icon-button" type="button" data-action="back-home" aria-label="返回首页">
            <span aria-hidden="true">←</span>
          </button>

          <div class="draw-header__title-group">
            <p id="draw-spread-kicker" class="eyebrow">THREE CARDS</p>
            <h2 id="draw-spread-title">时间之流</h2>
          </div>

          <button
            class="icon-button"
            type="button"
            data-action="open-library"
            aria-label="查看牌库"
          >
            <span aria-hidden="true">☷</span>
          </button>
        </header>

        <section class="draw-layout" aria-label="抽牌区域">
          
          <!-- 扇形牌堆视口。所有卡牌由 app.js 动态生成。 -->
          <section
            id="deck-viewport"
            class="deck-viewport"
            aria-label="塔罗牌堆，可拖动或滚动选择卡牌"
            tabindex="0"
          >
            <div id="deck-track" class="deck-track"></div>

           
          </section>

          <!-- 操作提示与抽牌按钮 -->
          <div class="draw-control-panel">
           <div class="draw-prompt">
             <span class="draw-prompt__star" aria-hidden="true">✦</span>
             <p>选择为你解读难题的宝石</p>
             <span class="draw-prompt__hint">拖动、滚动、轻扫，或按数字选择牌背</span>
           </div>

           <button
               id="draw-current-card"
               class="primary-button"
               type="button"
               data-action="draw-current-card"
           >
                抽取这张牌
           </button>
         </div>

          <!-- 已经抽出的背面牌；由 app.js 动态生成。 -->
          <section id="drawn-area" class="drawn-area" aria-label="已抽取的卡牌">
            <div id="drawn-cards" class="drawn-cards"></div>
          </section>
        </section>
      </main>

      <!-- =========================================================
           结果页：翻牌与解读
      ========================================================== -->
      <main id="result-page" class="page page--result" data-page="result" hidden>
        <header class="page-header result-header">
          <button
              class="icon-button"
              type="button"
              data-action="go-back"
              aria-label="返回上一页"
           >
              <span aria-hidden="true">←</span>
          </button>

          <div class="result-header__title-group">
            <p class="eyebrow">YOUR READING</p>
            <h2 id="result-title">时间之流</h2>
          </div>

          <button
            class="icon-button"
            type="button"
            data-action="open-library"
            aria-label="查看牌库"
          >
            <span aria-hidden="true">☷</span>
          </button>
        </header>

        <!-- 翻牌阶段与结果解读阶段共享此容器。 -->
        <section id="result-reading" class="result-reading" aria-live="polite">
          <div id="result-cards" class="result-cards"></div>
        </section>

        <footer id="result-actions" class="result-actions" hidden>
          <button class="secondary-button" type="button" data-action="restart-reading">
            重新抽牌
          </button>
          <button class="primary-button" type="button" data-action="open-library">
            查看牌库
          </button>
        </footer>
      </main>

      <!-- =========================================================
           牌库列表页
      ========================================================== -->
      <main id="library-page" class="page page--library" data-page="library" hidden>
        <header class="page-header library-header">
          <button class="icon-button" type="button" data-action="go-back" aria-label="返回上一页">
            <span aria-hidden="true">←</span>
          </button>

          <div class="library-header__title-group">
            <p class="eyebrow">TAROT ARCHIVE</p>
            <h2>宝石牌库</h2>
          </div>

          <span class="header-spacer" aria-hidden="true"></span>
        </header>

        <section class="library-toolbar" aria-label="牌库筛选与搜索">
          <label class="search-field">
            <span class="sr-only">搜索卡牌</span>
            <input
              id="library-search"
              type="search"
              autocomplete="off"
              placeholder="搜索牌名或宝石名称"
            />
            <span aria-hidden="true">⌕</span>
          </label>

          <div id="library-filters" class="filter-row" role="group" aria-label="牌库分类">
            <button class="filter-chip is-active" type="button" data-filter="all">全部</button>
            <button class="filter-chip" type="button" data-filter="major">大阿尔卡那</button>
            <button class="filter-chip" type="button" data-filter="wands">权杖</button>
            <button class="filter-chip" type="button" data-filter="cups">圣杯</button>
            <button class="filter-chip" type="button" data-filter="swords">宝剑</button>
            <button class="filter-chip" type="button" data-filter="pentacles">星币</button>
          </div>
        </section>

        <section id="library-list" class="library-list" aria-label="78 张塔罗牌列表"></section>
      </main>

      <!-- =========================================================
           牌库详情页
      ========================================================== -->
      <main id="card-detail-page" class="page page--detail" data-page="detail" hidden>
        <header class="page-header detail-header">
          <button class="icon-button" type="button" data-action="back-library" aria-label="返回牌库">
            <span aria-hidden="true">←</span>
          </button>

          <div class="detail-header__title-group">
            <p class="eyebrow">CARD ARCHIVE</p>
            <h2>卡牌释义</h2>
          </div>

          <span class="header-spacer" aria-hidden="true"></span>
        </header>

        <!-- 详情内容由 app.js 依照所选卡牌动态产生。 -->
        <article id="card-detail-content" class="card-detail-content"></article>
      </main>

      <!-- 全局 Toast 提示。 -->
      <div id="toast" class="toast" role="status" aria-live="polite" aria-atomic="true"></div>
    </div>

    <script src="./data/wands.js"></script>
    <script src="./data/cups.js"></script>
    <script src="./data/swords.js"></script>
    <script src="./data/pentacles.js"></script>
    <script src="./data/tarot-cards.js"></script>
    <script src="./app.js"></script>

<script>
  (() => {
    // 抽牌页由 app.js 在 <html> 上切换 is-draw-page 类。
    // 在该页内彻底拦截浏览器的滚动与缩放默认行为，
    // 避免滑动抽牌时背景被放大、音乐按钮随页面错位。
    const isDrawLocked = () =>
      document.documentElement.classList.contains('is-draw-page');

    document.addEventListener(
      'touchmove',
      (event) => {
        if (isDrawLocked()) event.preventDefault();
      },
      { passive: false }
    );

    document.addEventListener(
      'wheel',
      (event) => {
        if (isDrawLocked()) event.preventDefault();
      },
      { passive: false }
    );

    // 双指捏合缩放是 iOS 的 gesture 事件，touchmove.preventDefault 挡不住。
    // 必须在 gesturestart/change/end 上拦截，否则整页（含 fixed 背景与音乐按钮）会被放大。
    const blockGesture = (event) => {
      if (isDrawLocked()) event.preventDefault();
    };

    ['gesturestart', 'gesturechange', 'gestureend'].forEach((type) => {
      document.addEventListener(type, blockGesture, { passive: false });
    });
  })();
</script>

<script>
  (() => {
    // 低开销 Canvas 星空粒子背景，位于中景 PNG 之下（z-index:-5）
    const canvas = document.getElementById('starfield');
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    // 丰富星光色板：青/绿/蓝/紫/金/粉，赋予每颗星不同颜色的星光
    const colorPalette = [
      '#ffffff', '#d1fae5', '#a5f3fc', '#38bdf8', '#6ee7b7',
      '#c4b5ff', '#a78bfa', '#f0abfc', '#fcd34d', '#fda4af', '#7dd3fc'
    ];
    const TAU = Math.PI * 2;

    // —— 离屏精灵缓存：把星芒/星点预渲染到小 canvas，每帧用 drawImage 绘制，
    //    避免逐颗使用 shadowBlur / 渐变（canvas 最贵的操作）。这是反向视差后保持流畅的关键优化。
    const FLARE_SIZE = 64;   // 星芒精灵画布边长
    const FLARE_ARM = 30;    // 精灵内星芒臂长（中心到尖端）
    const DOT_SIZE = 32;     // 普通星点精灵画布边长
    const flareSprites = {}; // key: flareType + '|' + color
    const dotSprites = {};   // key: color

    function makeFlareSprite(type, color) {
      const c = document.createElement('canvas');
      c.width = c.height = FLARE_SIZE;
      const g = c.getContext('2d');
      const cx = FLARE_SIZE / 2, cy = FLARE_SIZE / 2;
      const rays = type === 'six' ? 6 : 4;
      const len = FLARE_ARM;
      const half = 2.2;
      const spread = rays === 6 ? 0.16 : 0.2;
      g.translate(cx, cy);
      for (let r = 0; r < rays; r++) {
        const ang = (TAU / rays) * r;
        const tipX = Math.cos(ang) * len, tipY = Math.sin(ang) * len;
        const lx = Math.cos(ang - spread) * half, ly = Math.sin(ang - spread) * half;
        const rx = Math.cos(ang + spread) * half, ry = Math.sin(ang + spread) * half;
        const grad = g.createLinearGradient(0, 0, tipX, tipY);
        grad.addColorStop(0, hexToRgba(color, 1));
        grad.addColorStop(1, hexToRgba(color, 0));
        g.fillStyle = grad;
        g.beginPath();
        g.moveTo(0, 0); g.lineTo(lx, ly); g.lineTo(tipX, tipY); g.lineTo(rx, ry);
        g.closePath(); g.fill();
      }
      // 亮核：径向渐变（白心 → 彩色 → 透明），替代 shadowBlur 的辉光
      const core = g.createRadialGradient(0, 0, 0, 0, 0, len * 0.5);
      core.addColorStop(0, 'rgba(255,255,255,1)');
      core.addColorStop(0.4, hexToRgba(color, 0.9));
      core.addColorStop(1, hexToRgba(color, 0));
      g.fillStyle = core;
      g.beginPath(); g.arc(0, 0, len * 0.5, 0, TAU); g.fill();
      return c;
    }

    function makeDotSprite(color) {
      const c = document.createElement('canvas');
      c.width = c.height = DOT_SIZE;
      const g = c.getContext('2d');
      const cx = DOT_SIZE / 2, cy = DOT_SIZE / 2;
      const halo = g.createRadialGradient(cx, cy, 0, cx, cy, cx);
      halo.addColorStop(0, hexToRgba(color, 1));
      halo.addColorStop(0.35, hexToRgba(color, 0.45));
      halo.addColorStop(1, hexToRgba(color, 0));
      g.fillStyle = halo;
      g.beginPath(); g.arc(cx, cy, cx, 0, TAU); g.fill();
      // 更亮的白色小核
      const core = g.createRadialGradient(cx, cy, 0, cx, cy, cx * 0.3);
      core.addColorStop(0, 'rgba(255,255,255,1)');
      core.addColorStop(1, 'rgba(255,255,255,0)');
      g.fillStyle = core;
      g.beginPath(); g.arc(cx, cy, cx * 0.3, 0, TAU); g.fill();
      return c;
    }

    function buildSprites() {
      colorPalette.forEach((color) => {
        dotSprites[color] = makeDotSprite(color);
        flareSprites['cross|' + color] = makeFlareSprite('cross', color);
        flareSprites['six|' + color] = makeFlareSprite('six', color);
      });
    }

    function hexToRgba(hex, a) {
      const h = hex.replace('#', '');
      const r = parseInt(h.substring(0, 2), 16);
      const g = parseInt(h.substring(2, 4), 16);
      const b = parseInt(h.substring(4, 6), 16);
      return `rgba(${r}, ${g}, ${b}, ${a})`;
    }

    let width = 0, height = 0, stars = [], nebulae = [];

    // 鼠标/指针动态交互：指针位置驱动多层视差（景深）
    let pTargetX = 0, pTargetY = 0;   // 指针目标偏移，归一化到 [-1, 1]
    let pX = 0, pY = 0;               // 平滑后的当前偏移
    let lastFgX = 0, lastFgY = 0;     // 上次写入前景 CSS 变量的偏移（用于跳过微小变化）
    const nebulaParallax = 8;         // 氛围星云视差位移(px)
    const starParallax = 22;          // 星点最大视差位移(px，乘以各自景深)
    const fgEl = document.querySelector('.foreground-layer');
    // 更稳妥的触屏判定：用 (hover: none) 判断，避免 Android「桌面站点」模式或指针能力误报把手机判成桌面
    const isTouch = window.matchMedia('(hover: none) and (pointer: coarse)').matches;
    const foregroundParallax = isTouch ? 14 : 24;

    // 远处氛围星云：大片柔光团，缓慢漂移 + 明暗呼吸（衬托主星系，比之前更明显）
    const nebulaPalette = ['#7c3aed', '#2563eb', '#0d9488', '#db2777', '#4f46e5'];
    function initNebulae() {
      nebulae = [];
      const base = Math.min(width, height) || 800;
      const count = 3;
      for (let i = 0; i < count; i++) {
        nebulae.push({
          x: Math.random() * width,
          y: Math.random() * height,
          r: base * (0.22 + Math.random() * 0.18),
          color: nebulaPalette[i % nebulaPalette.length],
          alpha: 0.16 + Math.random() * 0.10,
          driftX: (Math.random() - 0.5) * 0.05,
          driftY: (Math.random() - 0.5) * 0.04,
          speed: 0.00018 + Math.random() * 0.0003,
          phase: Math.random() * TAU
        });
      }
    }

    // （已移除旋转星系；星点 + 氛围星云保留，作为会移动的星空层）

    function resize() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = Math.floor(width * dpr);
      canvas.height = Math.floor(height * dpr);
      canvas.style.width = width + 'px';
      canvas.style.height = height + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0); // 之后按 CSS 像素绘制，高清屏更锐利
      initStars();
      initNebulae();
    }

    function initStars() {
      stars = [];
      const count = Math.floor((width * height) / 4000); // 密度调高：星更密
      for (let i = 0; i < count; i++) {
        // 约 18% 的星化为「星芒」：四芒十字(cross) 或 六条射线(six)
        // 其余约 32% 为「极小的远星」(isTiny)，再其余为普通星点
        const roll = Math.random();
        const isFlare = roll < 0.18;
        const isTiny = !isFlare && roll < 0.50;
        const size = isFlare ? (Math.random() * 1.2 + 1.4)
                   : isTiny ? (Math.random() * 0.35 + 0.25)
                   : (Math.random() * 1.0 + 0.5);
        const baseAlpha = isTiny ? (Math.random() * 0.35 + 0.25) : Math.random();
        // 景深：用于鼠标视差。远星(极小)动得少，近的星芒动得多
        const depth = isFlare ? 1.0 : (isTiny ? 0.3 : 0.55);
        stars.push({
          x: Math.random() * width,
          y: Math.random() * height,
          size,
          color: colorPalette[Math.floor(Math.random() * colorPalette.length)],
          speedY: Math.random() * 0.05 + 0.02,
          speedX: (Math.random() - 0.5) * 0.02,
          blinkSpeed: Math.random() * 0.015 + 0.005,
          alpha: baseAlpha,
          direction: Math.random() > 0.5 ? 1 : -1,
          isFlare,
          isTiny,
          depth,
          // 'cross' = 四芒十字闪烁星；'six' = 六条射线的星芒
          flareType: isFlare ? (Math.random() < 0.5 ? 'cross' : 'six') : null,
          twinklePhase: Math.random() * TAU,
          twinkleSpeed: Math.random() * 0.003 + 0.0015
        });
      }
    }

    // 普通星点：用预渲染精灵 drawImage（无 shadowBlur，极快）
    function drawDot(p, x, y) {
      const sprite = dotSprites[p.color];
      if (!sprite) return;
      const d = p.size * 4.4; // 光晕直径 ≈ 原 size*2.2 半径
      ctx.globalAlpha = p.alpha;
      ctx.drawImage(sprite, x - d / 2, y - d / 2, d, d);
    }

    // 星芒（十字 / 六射）：用预渲染精灵绘制，射线长度随闪烁伸缩（无 shadowBlur）
    function drawFlare(p, now, x, y) {
      // 防御：时间戳缺失/非有限时回退，避免 createLinearGradient 收到 NaN
      const t = (typeof now === 'number' && isFinite(now)) ? now : performance.now();
      const tw = 0.5 + 0.5 * Math.sin(t * p.twinkleSpeed + p.twinklePhase); // 0..1 闪烁
      const sprite = flareSprites[p.flareType + '|' + p.color];
      if (!sprite) return;
      const arm = (p.size * 3 + 8) * (0.55 + 0.45 * tw); // 目标臂长随闪烁伸缩
      const scale = arm / FLARE_ARM;
      const d = FLARE_SIZE * scale;
      ctx.globalAlpha = p.alpha * (0.55 + 0.45 * tw);
      ctx.drawImage(sprite, x - d / 2, y - d / 2, d, d);
    }

    // 远处氛围星云：加色混合画出柔光团，缓慢漂移、明暗呼吸（位于星空最底层，在背景图后方）
    function drawNebula(now, px, py) {
      ctx.save();
      ctx.globalCompositeOperation = 'lighter'; // 加色：暗底上叠出柔润辉光
      for (let i = 0; i < nebulae.length; i++) {
        const n = nebulae[i];
        n.x += n.driftX;
        n.y += n.driftY;
        const m = n.r;
        // 漂出边界后从对侧回绕，形成无尽流转
        if (n.x < -m) n.x = width + m; else if (n.x > width + m) n.x = -m;
        if (n.y < -m) n.y = height + m; else if (n.y > height + m) n.y = -m;
        const a = n.alpha * (0.6 + 0.4 * Math.sin(now * n.speed + n.phase)); // 呼吸明灭
        const g = ctx.createRadialGradient(n.x + px, n.y + py, 0, n.x + px, n.y + py, n.r);
        g.addColorStop(0, hexToRgba(n.color, a));
        g.addColorStop(1, hexToRgba(n.color, 0));
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(n.x + px, n.y + py, n.r, 0, TAU);
        ctx.fill();
      }
      ctx.restore();
    }

    function draw(now) {
      ctx.clearRect(0, 0, width, height);
      const t = (typeof now === 'number' && isFinite(now)) ? now : performance.now();
      // 指针视差平滑跟随
      pX += (pTargetX - pX) * 0.05;
      pY += (pTargetY - pY) * 0.05;

      // 星空（星点 + 星云）与前景层反向移动：前景随指针、星空逆指针，制造伪立体视差
      drawNebula(t, -pX * nebulaParallax, -pY * nebulaParallax); // 远处氛围星云（反向）
      // 前景 PNG 视差：仅在偏移变化明显时写入 CSS 变量，避免每帧无谓的样式计算
      if (fgEl) {
        const fx = pX * foregroundParallax;
        const fy = pY * foregroundParallax;
        if (Math.abs(fx - lastFgX) > 0.15 || Math.abs(fy - lastFgY) > 0.15) {
          fgEl.style.setProperty('--fg-x', fx.toFixed(1) + 'px');
          fgEl.style.setProperty('--fg-y', fy.toFixed(1) + 'px');
          lastFgX = fx; lastFgY = fy;
        }
      }
      for (let i = 0; i < stars.length; i++) {
        const p = stars[i];
        p.x += p.speedX;
        p.y += p.speedY;
        if (p.y > height) { p.y = 0; p.x = Math.random() * width; }
        if (p.x < 0) p.x = width;
        if (p.x > width) p.x = 0;

        p.alpha += p.blinkSpeed * p.direction;
        if (p.alpha >= 0.9) { p.alpha = 0.9; p.direction = -1; }
        else if (p.alpha <= 0.1) { p.alpha = 0.1; p.direction = 1; }

        // 星空整体与前景反向：前景随指针位移、星空逆指针位移，近的星芒动得多、远的极小星动得少
        const ox = -pX * starParallax * p.depth;
        const oy = -pY * starParallax * p.depth;
        const sx = p.x + ox, sy = p.y + oy;
        if (p.isFlare) drawFlare(p, now, sx, sy);
        else drawDot(p, sx, sy);
      }
      ctx.globalAlpha = 1;
      ctx.shadowBlur = 0;
    }

    function loop(t) {
      // 首次直接调用 loop() 时 rAF 尚未注入时间戳，需兜底，否则 now 为 undefined → NaN 报错
      draw((typeof t === 'number' && isFinite(t)) ? t : performance.now());
      requestAnimationFrame(loop);
    }

    // 防抖：避免调整窗口时频繁重绘
    let resizeTimer;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(resize, 250);
    });

    // 视差输入分流：
    //  - 桌面（精确指针）→ 鼠标 pointermove
    //  - 触屏 → 优先陀螺仪（需 HTTPS / iOS 授权），并始终绑定「触摸滑动」作为降级，
    //           即便陀螺仪不可用（HTTP 局域网、权限被拒），手指滑动也能驱动视差
    const clamp = (v) => Math.max(-1, Math.min(1, v));
    if (!isTouch) {
      window.addEventListener('pointermove', (e) => {
        pTargetX = (e.clientX / window.innerWidth - 0.5) * 2;
        pTargetY = (e.clientY / window.innerHeight - 0.5) * 2;
      }, { passive: true });
      window.addEventListener('pointerleave', () => { pTargetX = 0; pTargetY = 0; });
    } else {
      // 触摸滑动降级：手指在屏幕上的位置实时驱动视差（不依赖陀螺仪/HTTPS）
      const onTouchMove = (e) => {
        if (!e.touches || !e.touches.length) return;
        const t = e.touches[0];
        pTargetX = clamp((t.clientX / window.innerWidth - 0.5) * 2);
        pTargetY = clamp((t.clientY / window.innerHeight - 0.5) * 2);
      };
      window.addEventListener('touchmove', onTouchMove, { passive: true });

      // 陀螺仪：用设备倾斜替代鼠标，前景与星空反向错位产生伪立体感
      let gyroBound = false;
      const enableGyro = () => {
        const DOE = window.DeviceOrientationEvent;
        if (!DOE) {
          // iOS 在非 HTTPS 下不暴露该 API，是最常见的「没反应」原因
          console.warn('[视差] 本设备/浏览器未暴露 DeviceOrientationEvent（多见于 iOS 非 HTTPS 环境），已退回触摸滑动。');
          return;
        }
        let baseGamma = null, baseBeta = null; // 中性基准：以首次有效读数为「居中」，避免平持即满偏
        const onOrientation = (e) => {
          if (e.gamma == null && e.beta == null) return;
          // 以首次有效读数为中性基准：用户任意持机角度都视为居中，转动手机才驱动视差（手感更自然）
          if (baseGamma == null) { baseGamma = e.gamma || 0; baseBeta = e.beta || 0; }
          // gamma 左右倾斜、beta 前后倾斜，均相对中性基准，÷35 → ±35° 即满视差
          const gx = clamp(((e.gamma || 0) - baseGamma) / 35);
          const gy = clamp(((e.beta || 0) - baseBeta) / 35);
          pTargetX = gx;
          pTargetY = gy;
        };
        const attach = () => {
          if (gyroBound) return;
          gyroBound = true;
          window.addEventListener('deviceorientation', onOrientation, { passive: true });
          console.info('[视差] 陀螺仪已启用，倾斜手机即可驱动视差。');
        };
        // iOS 13+ 需在用户手势中申请权限（首次触摸/点击时触发）；非安全上下文会 reject
        if (typeof DOE.requestPermission === 'function') {
          DOE.requestPermission()
            .then((s) => { if (s === 'granted') attach(); else console.warn('[视差] 陀螺仪权限被拒绝，已退回触摸滑动。'); })
            .catch((err) => console.warn('[视差] 申请陀螺仪权限失败（通常需 HTTPS 安全上下文）：', err));
        } else {
          attach(); // Android 等无需权限，直接绑定
        }
      };
      window.addEventListener('touchstart', enableGyro, { once: true, passive: true });
      window.addEventListener('pointerdown', enableGyro, { once: true, passive: true });
    }

    buildSprites(); // 预渲染星芒/星点精灵（只建一次，与分辨率无关）
    resize();
    if (reduceMotion) draw(performance.now()); // 尊重「减少动态效果」：仅静态绘制一帧
    else loop();
  })();
</script>
  </body>
</html>
